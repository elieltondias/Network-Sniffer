name: Security

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  sast:
    name: SAST
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck libpcap-dev

      - name: clang-format (formatação)
        run: |
          python3 -m pip install --user clang-format==23.1.4
          "${HOME}/.local/bin/clang-format" --dry-run --Werror src/sniffer.c

      - name: Compilação estrita (-Werror)
        run: gcc -O2 -Wall -Wextra -Werror -Wconversion -Wshadow -o /tmp/sniffer-strict src/sniffer.c -lpcap

      - name: cppcheck (análise estática)
        run: |
          mkdir -p relatorios
          cppcheck \
            --enable=warning,performance,portability \
            --inline-suppr \
            --xml-version=2 \
            --suppress=missingIncludeSystem \
            src/ 2> relatorios/cppcheck.xml || true
          if [ ! -s relatorios/cppcheck.xml ] || ! grep -q '</results>' relatorios/cppcheck.xml; then
            echo "::error::cppcheck não gerou relatório válido"
            exit 1
          fi
          cat relatorios/cppcheck.xml
          if grep -Eq 'severity="(error|warning|performance|portability)"' relatorios/cppcheck.xml; then
            echo "::error::cppcheck encontrou problemas"
            exit 1
          fi

      - name: hadolint (Dockerfile)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          ignore: DL3018

      - name: actionlint (workflows)
        run: |
          VERSION=1.7.7
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          SC_VERSION=0.10.0
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SC_VERSION}/shellcheck-v${SC_VERSION}.linux.x86_64.tar.xz"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          PATH="/tmp/shellcheck-v${SC_VERSION}:$PATH" /tmp/actionlint -color

      - name: zizmor (workflows)
        run: |
          python3 -m pip install --user zizmor==1.32.0
          "${HOME}/.local/bin/zizmor" --min-severity low --format github .github/workflows/

      - name: CodeQL init
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: c-cpp
          build-mode: manual

      - name: CodeQL build
        run: gcc -O2 -Wall -Wextra -o /tmp/sniffer-codeql src/sniffer.c -lpcap

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          output: sarif-results

      - name: Gate de severidade (SARIF)
        run: |
          jq -s -e '
            [ .[]
              | .runs[]? as $run
              | $run.results[]? as $res
              | ($run.tool.driver.rules[]? | select(.id == $res.ruleId)) as $rule
              | select(((($rule.properties["security-severity"] // "0") | tonumber) >= 8.0)
                    or $res.level == "error")
            ] | length == 0
          ' sarif-results/*.sarif

      - name: Relatórios SAST
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relatorios-sast
          path: |
            relatorios/
            sarif-results/
          if-no-files-found: ignore

  dast:
    name: DAST
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev tcpdump

      - name: Build com sanitizers
        run: |
          gcc -O1 -g -Wall -Wextra -fsanitize=address,undefined \
            -fno-omit-frame-pointer -o sniffer-asan src/sniffer.c -lpcap

      - name: Execução dinâmica com tráfego
        run: |
          mkdir -p relatorios
          python3 -m http.server 8080 --bind 127.0.0.1 > relatorios/http.log 2>&1 &
          HTTP_PID=$!
          (
            for _ in $(seq 1 150); do
              curl -s -o /dev/null --max-time 2 http://127.0.0.1:8080/ || true
              ping -c 1 -W 1 127.0.0.1 > /dev/null 2>&1 || true
              sleep 0.1
            done
          ) &
          TRAFFIC_PID=$!
          set +e
          sudo env \
            ASAN_OPTIONS=halt_on_error=1:detect_leaks=1 \
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 60 ./sniffer-asan 2>&1 | tee relatorios/dast.log
          STATUS=${PIPESTATUS[0]}
          set -e
          kill "$TRAFFIC_PID" "$HTTP_PID" 2>/dev/null || true
          echo "exit code: $STATUS"
          exit "$STATUS"

      - name: Validações DAST
        run: |
          set -euo pipefail
          falhar() { echo "::error::$1"; exit 1; }

          if grep -E 'AddressSanitizer|UndefinedBehaviorSanitizer|runtime error:' relatorios/dast.log; then
            falhar 'Sanitizers detectaram erro durante a execução'
          fi

          shopt -s nullglob
          pcaps=(Pacotes/*.pcap)
          if [ "${#pcaps[@]}" -eq 0 ]; then
            falhar 'Nenhum arquivo .pcap gerado'
          fi

          for arquivo in "${pcaps[@]}"; do
            pacotes="$(tcpdump -r "$arquivo" 2>/dev/null | wc -l || true)"
            echo "$arquivo -> $pacotes pacotes"
            if [ "$pacotes" -eq 0 ]; then
              falhar "pcap vazio ou corrompido: $arquivo"
            fi
          done

      - name: Artefatos DAST
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capturas-dast
          path: |
            Pacotes/
            relatorios/
          if-no-files-found: ignore
